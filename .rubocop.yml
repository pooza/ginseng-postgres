# 正本は pooza/ginseng-style の config/rubocop.yml。ここには ginseng-postgres 固有の差分だけを書く。
# ⚠ 共通に見える緩和をここに足さないこと。共通化したい場合は pooza/ginseng-style に Issue を立てる。
# ⚠ `bundle exec rubocop` で実行すること（inherit_gem は gem のパス解決に Bundler を使う）。
inherit_gem:
  ginseng-style: config/rubocop.yml

# ⚠ rubocop-sequel はこの gem 固有のプラグインなので、正本ではなくここに置く。
plugins:
  - rubocop-sequel

AllCops:
  TargetRubyVersion: 3.3
Sequel:
  Exclude:
    - '*'
  Include:
    - '**/model/**/*.rb'
    - app/migration/**/*.rb
Sequel/ConcurrentIndex:
  Enabled: false
